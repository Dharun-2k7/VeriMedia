databases:
  # ────────────────────────────────────────────
  # PostgreSQL Database (Free 1GB on Render)
  # ────────────────────────────────────────────
  - name: verimedia-db
    plan: free
    region: oregon
    databaseName: verimedia
    user: verimedia

services:
  # ────────────────────────────────────────────
  # FastAPI Backend (Python + AI/ML Models)
  # ────────────────────────────────────────────
  - type: web
    name: verimedia-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: verimedia-db
          property: connectionString
      - key: STORAGE_DIR
        value: /opt/render/project/src/storage
      - key: FRONTEND_URL
        generateValue: false
        sync: false

  # ────────────────────────────────────────────
  # Next.js Frontend
  # ────────────────────────────────────────────
  - type: web
    name: verimedia-frontend
    runtime: node
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_API_URL
        generateValue: false
        sync: false
